model:
  num_classes: 6
  class_names:
    - open
    - short
    - mouse_bite
    - spur
    - pinhole
    - spurious_copper

  backbone:
    pretrained: true
    freeze_batch_norm: true

  neck:
    attention_reduction: 16

  image:
    train_min_sizes: [480, 560, 640, 720, 800, 880]
    test_min_size: 640
    max_size: 880
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  anchors:
    sizes:
      - [16]
      - [32]
      - [64]
      - [128]
      - [256]
    aspect_ratios:
      - [0.5, 1.0, 2.0]
      - [0.5, 1.0, 2.0]
      - [0.5, 1.0, 2.0]
      - [0.5, 1.0, 2.0]
      - [0.5, 1.0, 2.0]

  roi:
    featmap_names: [p2, p3, p4, p5, p6]
    pool_size: 7
    sampling_ratio: 2
    representation_size: 1024

  rpn:
    fg_iou_thresh: 0.7
    bg_iou_thresh: 0.3
    batch_size_per_image: 256
    positive_fraction: 0.5
    pre_nms_top_n_train: 2000
    pre_nms_top_n_test: 1000
    post_nms_top_n_train: 2000
    post_nms_top_n_test: 1000
    nms_thresh: 0.7

  box:
    fg_iou_thresh: 0.5
    bg_iou_thresh: 0.5
    batch_size_per_image: 512
    positive_fraction: 0.25
    bbox_reg_weights: null
    score_thresh: 0.05
    detections_per_img: 100

  soft_nms:
    enabled: true
    method: linear
    iou_thresh: 0.5
    sigma: 0.5
    score_thresh: 0.001
