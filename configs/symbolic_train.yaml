data:
  neg_ratio: 2
  storage_dtype: float32
  # Image-level model-selection split of the trainval export. null = full
  # dump (used for the final promoted training run, after the val sweep in
  # notebooks/03 has picked tree_depth/l1_lambda/sparsity_alpha/class_weights).
  # "train"/"val" are set by the sweep cells, not here.
  split: null
  val_fraction: 0.2
  split_seed: 0

search:
  tree_depth: 6
  iterations: 15
  l1_lambda: 0.001
  sparsity_alpha: 0.9
  logistic_max_iter: 200
  tolerance: 0.0001
  zero_threshold: 0.00001
  random_state: 112
  # Upweight the classes with the worst FN counts. Background stays 1.0 to
  # avoid trading the FP gains back. These weights, along with tree_depth/
  # l1_lambda/sparsity_alpha above, are selected on the val split
  # (notebooks/03) — not on test.txt.
  class_weights:
    short: 2.0
    spur: 1.5