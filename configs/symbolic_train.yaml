data:
  neg_ratio: 2
  storage_dtype: float32

# Fixed up front like the source papers — never tuned against any evaluation split.
# Values match checkpoints/symbolic/chosen.pt's training_config —
# the tree that produced the reported numbers.
search:
  tree_depth: 6
  iterations: 15
  l1_lambda: 20.0
  sparsity_alpha: 0.15
  # Per-node cap on L-BFGS-B iterations (formerly LIBLINEAR Newton steps); the slowest fit measured needed ~1000.
  logistic_max_iter: 2000
  # LIBLINEAR's stop rule at 1e-6 solves each node to within float32 precision of its optimum (sklearn's default
  # 1e-4 stops 0.1-4% above it with 6-120% extra nonzero weights). Float32 can't resolve much below 1e-6.
  tolerance: 0.000001
  zero_threshold: 0.00001
  random_state: 112
  # Worst-recall classes cost more; background stays 1.0 so false-positive gains hold.
  class_weights:
    short: 2.0
    spur: 1.5
    open: 1.5
    pinhole: 1.25
    spurious_copper: 1.25