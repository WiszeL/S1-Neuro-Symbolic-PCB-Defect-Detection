data:
  neg_ratio: 2
  storage_dtype: float32

# Fixed up front like the source papers — never tuned against any evaluation split.
# tree_depth/l1_lambda corrected to match checkpoints/symbolic/run1.pt's training_config —
# the values that actually produced the shipped tree and every reported number.
search:
  tree_depth: 6
  iterations: 15
  l1_lambda: 10.0
  sparsity_alpha: 0.15
  logistic_max_iter: 200
  tolerance: 0.0001
  zero_threshold: 0.00001
  random_state: 112
  # Worst-recall classes cost more; background stays 1.0 so false-positive gains hold.
  class_weights:
    short: 2.0
    spur: 1.5
    open: 1.5
    pinhole: 1.25