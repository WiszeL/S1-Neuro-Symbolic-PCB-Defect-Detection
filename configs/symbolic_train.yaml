data:
  neg_ratio: 2
  storage_dtype: float32

# Single source of truth for the SODT student's hyperparameters. These are
# fixed here a priori, the way both source papers fix tree depth before
# training (Hada §6.1/§6.2, Kairgeldin §6) rather than searching it — not
# tuned against any evaluation split.
search:
  tree_depth: 6
  iterations: 15
  l1_lambda: 0.001
  sparsity_alpha: 0.9
  logistic_max_iter: 200
  tolerance: 0.0001
  zero_threshold: 0.00001
  random_state: 112
  # Upweight the two defect classes with the worst recall. Background stays
  # 1.0 so the false-positive gains are not traded back. A stated design
  # choice fixed here, not tuned against an evaluation split.
  class_weights:
    short: 2.0
    spur: 1.5