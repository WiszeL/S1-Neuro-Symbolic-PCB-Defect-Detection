[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-skripsi-neuro"
version = "0.1.0"
description = "Research-grade PyTorch implementation of the non-referential DeepPCB detector from Fung et al. (2024)."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["neuro", "symbolic", "neurosym"]
